<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мини-мы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff8f4);
    --text: var(--tg-theme-text-color, #2b2226);
    --hint: var(--tg-theme-hint-color, #8c7b82);
    --card: var(--tg-theme-secondary-bg-color, #fbe9ec);
    --accent: #e8577a;
    --accent-text: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
  h1 { font-size: 28px; margin: 0; }
  .sub { color: var(--hint); margin: 4px 0 24px; font-size: 14px; }
  #status { padding: 24px 8px; color: var(--hint); }
  #hello { font-size: 20px; margin: 0 0 16px; }
  .counter {
    background: var(--card);
    border-radius: 20px;
    padding: 20px 16px;
    margin-bottom: 16px;
  }
  #hearts { display: block; font-size: 56px; font-weight: 700; line-height: 1; }
  .counter small { color: var(--hint); font-size: 14px; }
  .btn-wrap { position: relative; }
  #heartBtn {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #heartBtn:active { transform: scale(0.97); }
  #heartBtn:disabled { opacity: 0.7; }
  #players { color: var(--hint); font-size: 14px; margin: 16px 0 24px; }
  h2 { font-size: 16px; text-align: left; margin: 0 0 8px; }
  #events { list-style: none; padding: 0; margin: 0; text-align: left; }
  #events li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--card);
    font-size: 15px;
  }
  #events time { color: var(--hint); font-size: 13px; white-space: nowrap; }
  .fly {
    position: absolute;
    left: 50%;
    top: 0;
    font-size: 28px;
    pointer-events: none;
    animation: fly 1.1s ease-out forwards;
  }
  @keyframes fly {
    from { transform: translate(-50%, 0) scale(0.8); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), -140px) scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>
<main>
  <h1>Мини-мы</h1>
  <p class="sub">пробная версия</p>

  <section id="status">Загружаю…</section>

  <section id="game" hidden>
    <p id="hello"></p>
    <div class="counter">
      <span id="hearts">0</span>
      <small>сердечек на двоих</small>
    </div>
    <div class="btn-wrap">
      <button id="heartBtn" type="button">Отправить сердечко ❤️</button>
    </div>
    <p id="players"></p>
    <h2>Что было</h2>
    <ul id="events"></ul>
  </section>
</main>

<script>
  const API = "https://iqganejibxoapgvbnzse.supabase.co/functions/v1/game";
  const BOT = "@posha_palya_tamabot";
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  let busy = false;

  const ERRORS = {
    bad_auth: "Не получилось проверить, что это ты. Скорее всего, в Supabase неправильно вставлен токен бота (секрет BOT_TOKEN).",
    not_player: "Эта игра только для двоих, и оба места уже заняты 🙂",
    no_token: "В Supabase не добавлен секрет BOT_TOKEN.",
  };
  const NO_CONNECTION = "Не получилось связаться с сервером. Проверь, что функция game задеплоена и что в её настройках выключена проверка JWT (Verify JWT).";

  function showStatus(text) {
    $("game").hidden = true;
    $("status").hidden = false;
    $("status").textContent = text;
  }

  async function call(action) {
    let res;
    try {
      res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({ initData: tg.initData, action }),
      });
    } catch (_) {
      throw new Error(NO_CONNECTION);
    }
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const code = data && data.error;
      if (ERRORS[code]) throw new Error(ERRORS[code]);
      const msg = (data && (data.message || data.msg)) || "";
      if (res.status === 401) throw new Error(NO_CONNECTION);
      if (res.status === 404) throw new Error("Функция game не найдена. Проверь, что она называется именно game.");
      throw new Error("Ошибка " + res.status + (msg ? ": " + msg : ""));
    }
    return data;
  }

  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return "только что";
    const m = Math.floor(s / 60);
    if (m < 60) return m + " мин назад";
    const h = Math.floor(m / 60);
    if (h < 24) return h + " ч назад";
    return Math.floor(h / 24) + " дн назад";
  }

  const KINDS = { heart: "шлёт сердечко ❤️" };

  function render(d) {
    $("status").hidden = true;
    $("game").hidden = false;
    $("hello").textContent = "Привет, " + d.me.name + "!";
    $("hearts").textContent = (d.state && d.state.hearts) || 0;

    const others = d.players.filter((p) => !p.me);
    $("players").textContent = others.length
      ? "Вы играете вдвоём: ты и " + others[0].name + "."
      : "Ты в игре! Ждём второго игрока.";

    const ul = $("events");
    ul.innerHTML = "";
    if (!d.events.length) {
      const li = document.createElement("li");
      li.textContent = "Пока ничего не было";
      ul.append(li);
    }
    for (const e of d.events) {
      const li = document.createElement("li");
      const what = document.createElement("span");
      what.textContent = e.name + " " + (KINDS[e.kind] || e.kind);
      const when = document.createElement("time");
      when.textContent = ago(e.created_at);
      li.append(what, when);
      ul.append(li);
    }
  }

  function flyHeart() {
    const h = document.createElement("span");
    h.className = "fly";
    h.textContent = "❤️";
    h.style.setProperty("--dx", (Math.random() * 80 - 40).toFixed(0) + "px");
    document.querySelector(".btn-wrap").append(h);
    setTimeout(() => h.remove(), 1200);
  }

  async function refresh() {
    if (busy || document.hidden) return;
    busy = true;
    try {
      render(await call("hello"));
    } catch (e) {
      if ($("game").hidden) showStatus(e.message);
    } finally {
      busy = false;
    }
  }

  $("heartBtn").addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    $("heartBtn").disabled = true;
    flyHeart();
    try { tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
    try {
      render(await call("heart"));
    } catch (e) {
      try { tg.showAlert(e.message); } catch (_) { alert(e.message); }
    } finally {
      busy = false;
      $("heartBtn").disabled = false;
    }
  });

  if (!tg || !tg.initData) {
    showStatus("Эту страницу нужно открывать в Телеграме через бота " + BOT + ".");
  } else {
    tg.ready();
    tg.expand();
    refresh();
    setInterval(refresh, 5000);
  }
</script>
</body>
</html>
