<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мини-мы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

  :root {
    --bg: #fff8f4;
    --text: #2b2226;
    --hint: #8c7b82;
    --card: #fbe9ec;
    --accent: #e8577a;
    --line: #3a2a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1618; --text: #f5eef0; --hint: #a99aa0; --card: #2c2326; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 420px; margin: 0 auto; padding: 16px 16px 32px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0; white-space: nowrap; }
  #moodChip { font-size: 14px; color: var(--hint); text-align: right; min-width: 0; }

  .bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .bar { font-size: 12px; color: var(--hint); }
  .bar .track { height: 8px; border-radius: 99px; background: var(--card); overflow: hidden; margin-top: 4px; }
  .bar .fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
  #fFood { background: #f2a65a; }
  #fMood { background: #e8577a; }
  #fEnergy { background: #6bb0e8; }

  /* ---------- комната ---------- */
  .scene {
    position: relative;
    aspect-ratio: 4 / 5;
    border-radius: 24px;
    overflow: hidden;
    background: #f6e3d8;
    user-select: none;
    -webkit-user-select: none;
  }
  .wall {
    position: absolute; inset: 0 0 26% 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 14px, rgba(255,255,255,0) 14px 28px),
      linear-gradient(#f7e2d6, #f2d3c6);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 64px),
      linear-gradient(#dcb48c, #cfa37a);
    border-top: 3px solid #c4946a;
  }
  .rug {
    position: absolute; left: 12%; right: 12%; bottom: 5%; height: 13%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, #f4c3cd 0 45%, #e9a3b2 46% 70%, #e18fa1 71%);
  }
  .window {
    position: absolute; top: 9%; left: 9%; width: 30%; aspect-ratio: 1;
    border: 6px solid #fff; border-radius: 14px;
    background: linear-gradient(#bfe3fa, #e6f5ff);
    box-shadow: 0 2px 0 rgba(0,0,0,.06);
    overflow: hidden;
    transition: background 1s ease;
  }
  .window::before, .window::after { content: ""; position: absolute; background: #fff; }
  .window::before { left: 50%; top: 0; bottom: 0; width: 5px; transform: translateX(-50%); }
  .window::after { top: 50%; left: 0; right: 0; height: 5px; transform: translateY(-50%); }
  .sun, .moon { position: absolute; font-size: 22px; transition: opacity 1s ease, top 1s ease; }
  .sun { right: 10%; top: 8%; }
  .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; color: #fff7d6; font-size: 9px; }
  .stars i { position: absolute; font-style: normal; }
  .scene.is-evening .window { background: linear-gradient(#f6b26b, #f08a6c 60%, #c97a9a); }
  .scene.is-evening .sun { top: 58%; }
  .scene.is-night .window { background: linear-gradient(#1d2348, #363b6e); }
  .scene.is-night .sun { opacity: 0; }
  .scene.is-night .moon, .scene.is-night .stars { opacity: 1; }
  .moon { right: 12%; top: 10%; opacity: 0; }
  .poster {
    position: absolute; top: 12%; right: 12%; width: 20%; aspect-ratio: 3 / 4;
    background: #fff; border-radius: 6px; padding: 6px;
    box-shadow: 0 2px 0 rgba(0,0,0,.06);
    display: grid; place-items: center; font-size: 26px;
  }
  .plant { position: absolute; right: 17%; bottom: 17%; font-size: 46px; }
  .lamp { position: absolute; right: 2%; bottom: 17%; width: 17%; pointer-events: none; }
  .lamp svg { width: 100%; display: block; overflow: visible; }
  .lamp .bulb { opacity: 0; transition: opacity 1s ease; }
  .scene.is-night .lamp .bulb { opacity: 1; }
  .scene.is-night .lamp .shade { fill: #ffd89a; }
  .lamplight {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 88% 44%, rgba(255, 200, 120, .55) 0, rgba(255, 185, 110, .22) 22%, rgba(255, 180, 100, 0) 48%);
    mix-blend-mode: screen; transition: opacity 1s ease;
  }
  .scene.is-night .lamplight { opacity: 1; }
  .bed {
    position: absolute; left: 50%; bottom: 4%; width: 94%;
    transform: translateX(-50%);
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
  }
  .bed img { width: 100%; display: block; transform-origin: 50% 100%; }
  .scene.sleep .bed { opacity: 1; pointer-events: auto; cursor: pointer; }
  .scene.sleep .bed img { animation: bedBreath 4.5s ease-in-out infinite; }
  @keyframes bedBreath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.004, 1.012); } }
  .mover { transition: opacity .4s ease; }
  .scene.sleep .mover { opacity: 0; pointer-events: none; }

  .night {
    position: absolute; inset: 0;
    /* ночью в комнате темно, светлее всего у торшера справа */
    background: radial-gradient(circle at 88% 44%, rgba(28, 30, 72, .1) 0, rgba(28, 30, 72, .38) 35%, rgba(22, 24, 60, .58) 100%);
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
  }
  .scene.is-night .night { opacity: 1; }
  .scene.sleep:not(.is-night) .night { opacity: .4; }   /* днём во сне просто чуть приглушаем свет */

  /* ---------- персонаж ---------- */
  .mover {
    position: absolute; left: 0; bottom: 8%;
    height: 72%;
    aspect-ratio: 410 / 640;
    transform: translateX(0);
    will-change: transform;
  }
  .shadow {
    position: absolute; left: 18%; right: 18%; bottom: -2%; height: 5%;
    border-radius: 50%;
    background: rgba(60, 30, 30, .22);
    filter: blur(2px);
  }
  .char {
    position: absolute; inset: 0;
    transform-origin: 50% 100%;
    animation: breathe 3.2s ease-in-out infinite;
    cursor: pointer;
  }
  .char img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  .char .blink, .char .happy { visibility: hidden; }
  .char.eyes-closed .blink { visibility: visible; }
  .char .cute, .char .fatimg, .char .fatblink, .char .angry, .char .bomzh, .char .punchA, .char .punchB, .char .sad, .char .tired { visibility: hidden; }
  .char[data-pose] .base, .char[data-pose] .blink { visibility: hidden; }
  /* моргание в эмоциях: картинка с закрытыми глазами лежит поверх своей эмоции */
  .char .angryB, .char .cuteB, .char .tiredB, .char .sadB, .char .bomzhB { visibility: hidden; }
  .char.eyes-closed[data-pose="angry"] .angryB, .char.eyes-closed[data-pose="cute"] .cuteB,
  .char.eyes-closed[data-pose="tired"] .tiredB, .char.eyes-closed[data-pose="sad"] .sadB,
  .char.eyes-closed[data-pose="bomzh"] .bomzhB { visibility: visible; }
  .char[data-pose="happy"] .happy, .char[data-pose="cute"] .cute,
  .char[data-pose="angry"] .angry, .char[data-pose="bomzh"] .bomzh,
  .char[data-pose="punchA"] .punchA, .char[data-pose="punchB"] .punchB,
  .char[data-pose="sad"] .sad, .char[data-pose="tired"] .tired { visibility: visible; }
  /* в драке комната чуть трясётся */
  .scene.shake { animation: shake .18s linear infinite; }
  @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-2px, 1px); } 75% { transform: translate(2px, -1px); } }
  .char.fat img { visibility: hidden !important; }
  .char.fat .fatimg { visibility: visible !important; }
  .char.fat.eyes-closed .fatblink { visibility: visible !important; }
  #fatInfo { margin: -4px 0 10px; font-size: 13px; color: var(--hint); }
  #fatInfo[hidden] { display: none; }

  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.012, 1.02); }
  }
  @keyframes step {
    0% { transform: translateY(0) rotate(-1.6deg); }
    50% { transform: translateY(-7px) rotate(0deg); }
    100% { transform: translateY(0) rotate(1.6deg); }
  }
  @keyframes jump {
    0% { transform: scale(1.06, .92); }
    30% { transform: translateY(-40px) scale(.96, 1.06); }
    60% { transform: translateY(0) scale(1.07, .92); }
    80% { transform: scale(.98, 1.03); }
    100% { transform: scale(1, 1); }
  }
  @keyframes squish {
    0% { transform: scale(1, 1); }
    25% { transform: scale(1.08, .93); }
    50% { transform: scale(.97, 1.04); }
    75% { transform: scale(1.04, .97); }
    100% { transform: scale(1, 1); }
  }
  @keyframes sleepy {
    0%, 100% { transform: rotate(5deg) scale(1, 1); }
    50% { transform: rotate(5deg) scale(1.015, 1.03); }
  }
  .mover.walking .char { animation: step .42s ease-in-out infinite alternate; }
  .char.jump { animation: jump .7s ease-out; }
  .char.squish { animation: squish .8s ease-in-out; }
  .scene.sleep .char { animation: sleepy 5s ease-in-out infinite; }

  /* облачко с настроением и реплики */
  .cloud {
    position: absolute; left: 50%; top: -21%;
    transform: translateX(-50%) scale(0);
    background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: 26px; line-height: 1;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
    transition: transform .35s cubic-bezier(.3,1.6,.5,1);
    white-space: nowrap;
  }
  .cloud::after {
    content: ""; position: absolute; left: 50%; bottom: -9px;
    width: 12px; height: 12px; border-radius: 50%; background: #fff;
    transform: translateX(-50%);
  }
  .cloud.show { transform: translateX(-50%) scale(1); }
  /* когда сидит, облачко и реплики ниже — над головой */
  .char[data-pose="sad"] ~ .cloud { top: 5%; }
  .char[data-pose="sad"] ~ .bubble, .char[data-pose="bomzh"] ~ .bubble { top: 14%; }
  .bubble {
    position: absolute; left: 62%; top: 0;
    background: #fff; color: #2b2226;
    border-radius: 14px; padding: 6px 10px;
    font-size: 15px; font-weight: 600; width: max-content; line-height: 1.25;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
    opacity: 0; transform: translateY(8px) scale(.9);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: translateY(0) scale(1); }
  #bedBubble { z-index: 3; }

  .fx { position: absolute; inset: 0; pointer-events: none; }
  .particle { position: absolute; font-size: 26px; line-height: 1; will-change: transform, opacity; }
  .z { position: absolute; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.3); }

  /* ---------- кнопки ---------- */
  .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .actions button, .moods button {
    border: 0; border-radius: 16px;
    background: var(--card); color: var(--text);
    padding: 10px 4px 8px;
    font: inherit; font-size: 12px; line-height: 1.2;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .actions button span { font-size: 24px; line-height: 1; }
  .actions button:active, .moods button:active { transform: scale(.95); }
  .actions button.on { background: var(--accent); color: #fff; }
  .moods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  @media (max-width: 359px) {
    .actions { gap: 6px; }
    .actions button { font-size: 11px; }
    .actions button span { font-size: 22px; }
  }
  .moods[hidden] { display: none; }
  .moods button { flex-direction: row; justify-content: center; font-size: 14px; padding: 10px 6px; }
  .moods button span { font-size: 20px; }

  .note { color: var(--hint); font-size: 13px; margin: 14px 0 0; }
  .dev { margin-top: 10px; border: 1px dashed var(--hint); background: none; color: var(--hint); border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .char, .mover.walking .char, .scene.sleep .char { animation: none; }
  }


  /* ---------- игра ---------- */
  :root[data-theme="dark"] { --bg: #1b1618; --text: #f5eef0; --hint: #a99aa0; --card: #2c2326; }
  :root[data-theme="light"] { --bg: #fff8f4; --text: #2b2226; --hint: #8c7b82; --card: #fbe9ec; }
  main { padding-top: 12px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 4px; }
  .tabs button { border: 0; background: none; color: var(--text); font: inherit; font-size: 15px; font-weight: 600; padding: 9px 4px; border-radius: 11px; cursor: pointer; position: relative; }
  .tabs button.on { background: var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .tabs .dot { position: absolute; top: 6px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .tabs .dot[hidden] { display: none; }
  .moods button.on { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sub { margin: 0 0 10px; text-align: center; font-size: 13px; color: var(--hint); }
  #info { margin: -4px 0 10px; font-size: 13px; color: var(--hint); }
  #info[hidden] { display: none; }

  .poster { cursor: default; transition: box-shadow .4s ease; }
  .poster.glow { cursor: pointer; animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 87, 122, .0), 0 2px 0 rgba(0,0,0,.06); } 50% { box-shadow: 0 0 18px 6px rgba(232, 87, 122, .55), 0 2px 0 rgba(0,0,0,.06); } }
  .placeholder { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 78%; background: rgba(255,255,255,.92); color: #2b2226; border-radius: 18px; padding: 18px 16px; text-align: center; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .placeholder b { display: block; font-size: 18px; margin-bottom: 4px; }
  .placeholder[hidden] { display: none; }
  .actions[hidden] { display: none; }
  .actions.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions button .badge { position: absolute; }
  .actions button { position: relative; }
  .actions button .count { position: absolute; top: 6px; right: 10px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; padding: 0 5px; }
  .actions button .count[hidden] { display: none; }

  .journal { margin-top: 16px; }
  .journal[hidden] { display: none; }
  .journal h2 { font-size: 15px; margin: 0 0 6px; }
  .journal p { margin: 0 0 8px; font-size: 14px; }
  .journal ul { list-style: none; padding: 0; margin: 0; }
  .journal li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--card); font-size: 14px; }
  .journal time { color: var(--hint); font-size: 12px; white-space: nowrap; }

  .debug { margin-top: 22px; border: 1px dashed var(--hint); border-radius: 16px; padding: 12px; }
  .debug[hidden] { display: none; }
  .debug h2 { font-size: 13px; margin: 0 0 4px; color: var(--hint); }
  .debug p { font-size: 12px; color: var(--hint); margin: 0 0 8px; }
  .debug .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .debug button, .debug label { border: 1px solid var(--hint); background: none; color: var(--text); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .debug button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .debug label { display: inline-flex; align-items: center; gap: 6px; }

  /* окно поверх игры: записки */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal[hidden] { display: none; }
  .sheet { background: var(--bg); color: var(--text); width: 100%; max-width: 420px; max-height: 85vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px 16px 24px; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chips button { border: 0; background: var(--card); color: var(--text); border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  .sheet textarea { width: 100%; min-height: 90px; border-radius: 12px; border: 1px solid var(--card); background: var(--card); color: var(--text); padding: 10px; font: inherit; font-size: 15px; resize: vertical; }
  .sheet .left { text-align: right; font-size: 12px; color: var(--hint); margin: 4px 0 12px; }
  .sheet .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet .btns button { border: 0; border-radius: 14px; padding: 13px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--card); color: var(--text); }
  .sheet .btns button.primary { background: var(--accent); color: #fff; }
  .sheet .btns button:disabled { opacity: .5; }
  .letter { background: #fff; color: #2b2226; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .letter.new { border: 2px solid var(--accent); }
  .letter p { margin: 0 0 6px; font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .letter time { font-size: 12px; color: #8c7b82; }
  .empty { color: var(--hint); font-size: 14px; }

  #status { padding: 40px 8px; text-align: center; color: var(--hint); }
  #status[hidden] { display: none; }
  #game[hidden] { display: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b2226; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <p id="status">Загружаю…</p>

  <div id="game" hidden>
    <nav class="tabs">
      <button type="button" id="tabCare"></button>
      <button type="button" id="tabOwn"><span id="ownLabel"></span><span class="dot" id="ownDot" hidden></span></button>
    </nav>
    <p class="sub" id="sub"></p>

    <header>
      <h1 id="title"></h1>
      <div id="moodChip"></div>
    </header>

    <div class="bars" id="bars">
      <div class="bar">Сытость<div class="track"><div class="fill" id="fFood"></div></div></div>
      <div class="bar">Настроение<div class="track"><div class="fill" id="fMood"></div></div></div>
      <div class="bar">Силы<div class="track"><div class="fill" id="fEnergy"></div></div></div>
    </div>
    <p id="info" hidden></p>

    <div class="scene" id="scene">
      <div class="wall"></div>
      <div class="window"><span class="stars"><i style="left:14%;top:18%">✦</i><i style="left:32%;top:62%">✧</i><i style="left:62%;top:70%">✦</i><i style="left:44%;top:30%">·</i><i style="left:20%;top:80%">·</i></span><span class="sun">☀️</span><span class="moon">🌙</span></div>
      <div class="poster" id="poster">💌</div>
      <div class="floor"></div>
      <div class="rug"></div>
      <div class="lamp" aria-hidden="true">
        <svg viewBox="0 0 60 180">
          <defs><filter id="lampGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs>
          <ellipse class="bulb" cx="30" cy="40" rx="34" ry="30" fill="#ffd27a" opacity=".6" filter="url(#lampGlow)"/>
          <path class="shade" d="M14 10 H46 L56 52 H4 Z" fill="#f3e4d4" stroke="#3a2a2e" stroke-width="3" stroke-linejoin="round"/>
          <line x1="30" y1="52" x2="30" y2="168" stroke="#3a2a2e" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="30" cy="171" rx="17" ry="5" fill="#8a6d5a" stroke="#3a2a2e" stroke-width="3"/>
        </svg>
      </div>
      <div class="plant">🪴</div>
      <div class="bed" id="bed"><img id="bedImg" alt=""></div>

      <div class="mover" id="mover">
        <div class="shadow"></div>
        <div class="char" id="char"></div>
        <div class="cloud" id="cloud"></div>
        <div class="bubble" id="bubble"></div>
      </div>

      <div class="night"></div>
      <div class="lamplight"></div>
      <div class="bubble" id="bedBubble"></div>
      <div class="fx" id="fx"></div>
      <div class="placeholder" id="placeholder" hidden></div>
    </div>

    <div class="actions" id="careActions">
      <button type="button" id="bFeed"><span>🍪</span>Кормить</button>
      <button type="button" id="bHug"><span>🤗</span>Обнять</button>
      <button type="button" id="bSleep"><span>😴</span>Спать</button>
      <button type="button" id="bNote"><span>💌</span>Записка</button>
    </div>
    <div class="actions two" id="ownActions" hidden>
      <button type="button" id="bMood"><span>💭</span>Эмоция</button>

      sadFeed: ["Спасибо… 🥺", "Сладкое немножко помогает"], sadSit: ["Мне грустно…", "Посижу тут немножко"], sadGreet: ["Привет… мне грустно"],

const EMO = {

  tired: { e: "😮‍💨", t: { f: "устала", m: "устал" }, pose: "tired" },

const NOTE_TEMPLATES = ["Ты молодец, я тобой горжусь", "Не забудь поесть 🍫", "Отдохни хоть 5 минут", "Скучаю", "Люблю тебя"];

/* ---------- правила (как на сервере) ---------- */
const DECAY = 100 / 36, SLEEP_GAIN = 25, LOW = 30, BOMZH = 10;

/* ---------- состояние ---------- */
let srv = null, skew = 0;          // последний ответ сервера и разница часов
let asPasha = false, fastFat = false, timeOverride = null;
let tab = "care", viewChar = null, greeted = false;
const partnerOf = (c) => (c === "polina" ? "pasha" : "polina");

/* ---------- связь с сервером ---------- */
const ERRORS = {
  bad_auth: "Не получилось проверить, что это ты. Проверь секрет BOT_TOKEN в Supabase.",
  not_player: "Эта игра только для двоих, и оба места уже заняты 🙂",
  no_token: "В Supabase не добавлен секрет BOT_TOKEN.",
};
async function api(action, extra = {}) {
  let res;
  try {
    res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ initData: tg.initData, action, as: asPasha ? "pasha" : undefined, ...extra }),
    });
  } catch (_) {
    throw new Error("Нет связи с сервером. Проверь интернет и VPN.");
  }
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const code = data && data.error;
    if (ERRORS[code]) throw new Error(ERRORS[code]);
    if (res.status === 404) throw new Error("Функция game не найдена в Supabase.");
    throw new Error("Ошибка " + res.status + (data && data.message ? ": " + data.message : ""));
  }
  if (data.state) setServer(data.state);
  return data;
}
function setServer(s) {
  srv = s;
  skew = Date.parse(s.now) - Date.now();
}
const now = () => Date.now() + skew;

/* живые шкалы между ответами сервера */
function live(c) {
  const s = srv.chars[c];
  const h = Math.max(0, (now() - Date.parse(s.updated_at)) / 3600e3);
  let energy, sleeping = s.sleeping;
  if (sleeping) { energy = clamp(s.energy + SLEEP_GAIN * h); if (energy >= 100) sleeping = false; }
  else energy = clamp(s.energy - DECAY * h);
  const fatUntil = s.fat_until ? Date.parse(s.fat_until) : 0;
  return {
    food: clamp(s.food - DECAY * h), mood: clamp(s.mood - DECAY * h), energy, sleeping,
    fat: fatUntil > now(), fatUntil, emotion: s.emotion || "good",
  };
}

/* =========================================================
   Комната и персонаж (как в демо)
   ========================================================= */
const scene = $("scene"), mover = $("mover"), ch = $("char"), fx = $("fx");
let cfg = null, S = {};          // S — что сейчас показано в комнате
let x = 0, walking = false, walkTimer = null, poseTimer = null, bubbleTimer = null, zTimer = null;
let moodPose = null, bomzh = false, bomzhSeated = false, sadSeated = false;
let angryHugs = 0, angryTaps = [], fighting = false, lastTapSent = 0;

function buildChar() {
  ch.innerHTML = "";
  if (!cfg.ready) return;
  for (const p of POSES) {
    const img = document.createElement("img");
    img.className = CLASS[p];
    img.alt = p === "base" ? cfg.mini : "";
    img.src = cfg.dir + p + ".webp";
    ch.append(img);
  }
  $("bedImg").src = cfg.dir + "bed.webp";
  $("bedImg").alt = cfg.mini + " спит";
}

const maxX = () => scene.clientWidth - mover.offsetWidth;
function place(px, seconds) {
  x = px;
  mover.style.transition = seconds ? `transform ${seconds}s linear, opacity .4s ease` : "opacity .4s ease";
  mover.style.transform = `translateX(${px}px)`;
}
function play(cls) {
  ch.classList.remove("jump", "squish");
  void ch.offsetWidth;
  ch.classList.add(cls);
  ch.addEventListener("animationend", () => ch.classList.remove(cls), { once: true });
}
function say(text, ms = 1600) {
  if (!text) return;
  if (S.sleeping) {
    const bb = $("bedBubble"), br = $("bed").getBoundingClientRect(), s = scene.getBoundingClientRect();
    bb.textContent = text;
    bb.style.left = (br.left - s.left + br.width * .42) + "px";
    bb.style.top = Math.max(8, br.top - s.top - 10) + "px";
    bb.style.maxWidth = (s.width * .5) + "px";
    bb.classList.add("show");
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bb.classList.remove("show"), ms);
    return;
  }
  $("bedBubble").classList.remove("show");
  const b = $("bubble");
  b.textContent = text;
  const sw = scene.clientWidth, mw = mover.offsetWidth;
  const right = sw - (x + mw * .62) - 8, left = x + mw * .38 - 8;
  if (right >= left) { b.style.left = "62%"; b.style.right = "auto"; b.style.maxWidth = Math.max(120, right) + "px"; }
  else { b.style.left = "auto"; b.style.right = "62%"; b.style.maxWidth = Math.max(120, left) + "px"; }
  b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove("show"), ms);
}
const sayP = (key, ms) => cfg.say[key] && say(pick(cfg.say[key]), ms);

function center() {
  const r = mover.getBoundingClientRect(), s = scene.getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2, top: r.top - s.top, h: r.height, w: r.width };
}
function particle(text, fromX, fromY, opts = {}) {
  const p = document.createElement("span");
  p.className = "particle";
  p.textContent = text;
  p.style.left = fromX + "px";
  p.style.top = fromY + "px";
  if (opts.size) p.style.fontSize = opts.size + "px";
  fx.append(p);
  const dx = opts.dx ?? (Math.random() * 80 - 40);
  const dy = opts.dy ?? -(90 + Math.random() * 60);
  const a = p.animate([
    { transform: "translate(-50%, -50%) scale(.6)", opacity: 0 },
    { transform: "translate(-50%, -50%) scale(1.1)", opacity: 1, offset: .2 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2)`, opacity: 0 },
  ], { duration: opts.duration || 1300, easing: "ease-out", delay: opts.delay || 0, fill: "both" });
  a.onfinish = () => p.remove();
}
function hearts(n = 6) {
  let c = center();
  if (S.sleeping) {
    const br = $("bed").getBoundingClientRect(), s = scene.getBoundingClientRect();
    c = { x: br.left - s.left + br.width * .3, top: br.top - s.top, h: br.height * .6, w: br.width * .3 };
  }
  for (let i = 0; i < n; i++) {
    const side = i % 2 ? 1 : -1;
    particle(["❤️", "💕", "💗"][i % 3], c.x + side * c.w * (.3 + Math.random() * .2), c.top + c.h * (.4 + Math.random() * .15), { delay: i * 90, dx: side * (10 + Math.random() * 30) });
  }
}

/* --- позы --- */
function restPose() {
  if (bomzh && bomzhSeated) return "bomzh";
  if (moodPose === "sad") return sadSeated ? "sad" : null;
  return moodPose;
}
function applyRest() { const r = restPose(); if (r) ch.dataset.pose = r; else delete ch.dataset.pose; }
function basePose() { clearTimeout(poseTimer); applyRest(); }
function showPose(name, ms) {
  clearTimeout(poseTimer);
  ch.classList.remove("eyes-closed");
  ch.dataset.pose = name;
  play("jump");
  poseTimer = setTimeout(() => { applyRest(); play("squish"); }, ms);
}

/* --- прогулка --- */
function scheduleWalk() { clearTimeout(walkTimer); walkTimer = setTimeout(walk, 3500 + Math.random() * 5000); }
function walk() {
  if (!cfg.ready || S.sleeping || bomzh || fighting || moodPose === "sad") return scheduleWalk();
  const m = maxX();
  let target = Math.random() * m;
  if (Math.abs(target - x) < m * .25) target = x < m / 2 ? m * (.6 + Math.random() * .4) : m * Math.random() * .4;
  const seconds = Math.max(1.2, Math.abs(target - x) / (S.fat ? 30 : moodPose === "tired" ? 28 : 55));
  walking = true;
  mover.classList.add("walking");
  place(target, seconds);
  setTimeout(() => { walking = false; mover.classList.remove("walking"); scheduleWalk(); }, seconds * 1000);
}
function stopWalking() {
  if (!walking) return;
  const r = mover.getBoundingClientRect(), s = scene.getBoundingClientRect();
  place(r.left - s.left, 0);
  walking = false;
  mover.classList.remove("walking");
}

/* --- грустная садится, бомжик уходит в угол --- */
function walkThenSit(target, onArrive) {
  clearTimeout(walkTimer); stopWalking();
  const secs = Math.max(.5, Math.abs(target - x) / 45);
  mover.classList.add("walking");
  place(target, secs);
  setTimeout(() => { mover.classList.remove("walking"); onArrive(); }, secs * 1000);
}
function goSitSad(instant) {
  sadSeated = false; applyRest();
  const target = maxX() * .45;
  const arrive = () => {
    if (moodPose !== "sad") return;
    sadSeated = true; applyRest();
    if (!instant) { play("squish"); sayP("sadSit", 2200); }
  };
  if (instant) { place(target, 0); arrive(); } else walkThenSit(target, arrive);
}
function becomeBomzh(instant) {
  bomzh = true; bomzhSeated = false;
  $("cloud").classList.remove("show");
  clearTimeout(poseTimer); applyRest();
  const arrive = () => {
    bomzhSeated = true;
    if (!bomzh) return;
    applyRest();
    if (!instant) { play("squish"); if (!S.sleeping) sayP("bomzh", 2500); }
  };
  if (instant) { place(0, 0); arrive(); } else walkThenSit(0, arrive);
}
function leaveBomzh() {
  bomzh = false; bomzhSeated = false;
  if (S.sleeping) { applyRest(); return; }
  stopWalking(); basePose(); play("jump");
  sayP("bomzhLeave", 2000);
  setTimeout(() => { const ph = needPhrase(); if (ph && !bomzh && !S.sleeping && !S.fat) say(ph, 2500); }, 2300);
  if (moodPose === "sad") setTimeout(() => goSitSad(false), 2400);
  scheduleWalk();

/* --- драка --- */
function fight() {
  fighting = true;
  clearTimeout(poseTimer); clearTimeout(walkTimer);
  ch.classList.remove("eyes-closed");
  scene.classList.add("shake");
  sayP("fight", 2200);
  let n = 0;
  const t = setInterval(() => {
    ch.dataset.pose = n % 2 ? "punchB" : "punchA";
    if (n % 3 === 0) {
      const c = center();
      particle(pick(["💥", "💢", "💥"]), c.x + (n % 2 ? 1 : -1) * c.w * .28, c.top + c.h * .38, { size: 30, dy: -30, dx: (n % 2 ? 20 : -20), duration: 500 });
    }
    n++;
    if (n >= 14) {
      clearInterval(t);
      scene.classList.remove("shake");
      fighting = false;
      applyRest(); play("squish");
      sayP("afterFight", 2400);
      scheduleWalk();
    }
  }, 170);
}

/* --- сон --- */
function spawnZ() {
  const br = $("bed").getBoundingClientRect(), s = scene.getBoundingClientRect();

  z.className = "z"; z.textContent = "Z";
  z.style.left = (br.left - s.left + br.width * .3) + "px";

  fx.append(z);
  const a = z.animate([
    { transform: "translate(0, 0) rotate(-10deg)", opacity: 0 }, { opacity: 1, offset: .2 },
    { transform: "translate(40px, -90px) rotate(10deg)", opacity: 0 },
  ], { duration: 2600, easing: "ease-out" });
  a.onfinish = () => z.remove();
}
function setSleepVisual(on, instant) {
  S.sleeping = on;
  scene.classList.toggle("sleep", on);
  clearInterval(zTimer);
  if (on) {
    stopWalking(); clearTimeout(poseTimer); applyRest();
    $("bubble").classList.remove("show");

    $("bedBubble").classList.remove("show");
    if (!instant) { play("jump"); sayP("morning"); }

/* --- толстенькая --- */
function setFatVisual(on, instant) {
  S.fat = on;
  ch.classList.toggle("fat", on);

    clearTimeout(poseTimer); applyRest();
    ch.classList.remove("eyes-closed");
    $("moods").hidden = true; $("bMood").classList.remove("on");
    if (!instant) {
      play("squish"); sayP("becameFat", 3000);
      setTimeout(() => { if (S.fat) sayP("becameFat2", 3000); }, 3200);
    }
  } else if (!instant) {
    stopWalking(); showPose("happy", 2200); sayP("slim", 2500); hearts(4); scheduleWalk();
  }
}

/* --- моргание --- */
const BLINKS = ["angry", "cute", "tired", "sad", "bomzh"];
function blinkOnce() {
  if (!cfg || !cfg.ready || S.sleeping || fighting || (ch.dataset.pose && !S.fat && !BLINKS.includes(ch.dataset.pose))) return;
  ch.classList.add("eyes-closed");
  setTimeout(() => ch.classList.remove("eyes-closed"), 130);
}
(function blinkLoop() {
  blinkOnce();
  if (Math.random() < .25) setTimeout(blinkOnce, 260);
  setTimeout(blinkLoop, 2200 + Math.random() * 3800);
})();

/* --- что она говорит, когда чего-то не хватает --- */
function needPhrase() {
  const L = live(viewChar);
  const low = [["food", L.food], ["mood", L.mood], ["energy", L.energy]].filter(([, v]) => v < LOW).sort((a, b) => a[1] - b[1]);
  return low.length ? pick(cfg.say.need[low[0][0]]) : null;
}
setInterval(() => {
  if (!cfg || !cfg.ready || S.sleeping || S.fat || $("bubble").classList.contains("show")) return;
  const ph = needPhrase();
  if (ph && Math.random() < .7) say(ph, 2200);
}, 9000);
setInterval(() => { if (cfg && cfg.ready && S.fat && !$("bubble").classList.contains("show") && Math.random() < .5) sayP("fatSad", 2200); }, 7000);

/* =========================================================
   Синхронизация: то, что пришло с сервера, → в комнату
   ========================================================= */
function sync(instant) {
  if (!srv || !cfg) return;
  renderHeader();
  if (!cfg.ready) return;
  const L = live(viewChar);

  // сон
  if (L.sleeping !== !!S.sleeping) setSleepVisual(L.sleeping, instant);
  // толстенькая
  if (L.fat !== !!S.fat) setFatVisual(L.fat, instant);
  // эмоция
  const pose = EMO[L.emotion] ? EMO[L.emotion].pose : null;
  if (pose !== moodPose) {
    moodPose = pose; angryHugs = 0;
    if (!bomzh && !fighting) {
      clearTimeout(poseTimer);
      if (pose === "sad") goSitSad(instant);
      else { sadSeated = false; applyRest(); if (!instant) play("jump"); }
    }
  }
  // бомжик: только пока все три шкалы ниже 10%
  const allLow = L.food < BOMZH && L.mood < BOMZH && L.energy < BOMZH && !L.fat;
  if (allLow && !bomzh) becomeBomzh(instant);
  else if (!allLow && bomzh) leaveBomzh();
  renderButtons();
}

function fmtLeft(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
function renderHeader() {
  const me = srv.actor, partner = partnerOf(me);
  $("tabCare").textContent = CHARS[partner].mini;
  $("ownLabel").textContent = CHARS[me].mini;
  $("tabCare").classList.toggle("on", tab === "care");
  $("tabOwn").classList.toggle("on", tab === "own");
  const unread = (srv.notes || []).filter((n) => !n.read_at).length;
  $("ownDot").hidden = !(unread && tab !== "own");
  $("letterCount").hidden = !unread; $("letterCount").textContent = unread;

  const c = CHARS[viewChar];
  $("title").textContent = c.mini;
  $("sub").textContent = tab === "care"
    ? (c.f ? "ты заботишься о ней" : "ты заботишься о нём")
    : "это ты: так тебя видит " + CHARS[partner].name;

  if (!c.ready) {
    $("bars").style.visibility = "hidden"; $("moodChip").textContent = ""; $("info").hidden = true;
    return;
  }
  $("bars").style.visibility = "";
  const L = live(viewChar);
  $("fFood").style.width = L.food + "%";
  $("fMood").style.width = L.mood + "%";
  $("fEnergy").style.width = L.energy + "%";

  const emo = EMO[L.emotion] || EMO.good;
  if (L.fat) $("moodChip").textContent = "сейчас: поправилась 😤";
  else $("moodChip").textContent = "сегодня: " + (c.f ? emo.t.f : emo.t.m) + " " + emo.e;
  const cloud = $("cloud");
  cloud.textContent = emo.e;
  cloud.classList.toggle("show", L.emotion !== "good" && !L.fat && !bomzh);

  const info = $("info");
  const allLow = L.food < BOMZH && L.mood < BOMZH && L.energy < BOMZH && !L.fat;
  if (L.fat) { info.hidden = false; info.textContent = "🍰 Поправилась от сладкого. Похудеет через " + fmtLeft(L.fatUntil - now()); }
  else if (allLow) { info.hidden = false; info.textContent = "😵 Про " + (c.f ? "неё" : "него") + " забыли. Покорми, обними или уложи спать"; }
  else if (L.sleeping) { info.hidden = false; info.textContent = "😴 Спит. Силы: " + Math.round(L.energy) + "%"; }
  else info.hidden = true;
}
function renderButtons() {
  const own = tab === "own", ready = cfg && cfg.ready;
  $("careActions").hidden = own || !ready;
  $("ownActions").hidden = !own || !ready;
  if (own || !ready) $("moods").hidden = true;
  $("journal").hidden = !own;
  const b = $("bSleep");
  b.classList.toggle("on", !!S.sleeping);
  b.innerHTML = S.sleeping ? "<span>☀️</span>Будить" : "<span>😴</span>Спать";
  const unread = srv && (srv.notes || []).some((n) => !n.read_at);
  $("poster").classList.toggle("glow", own && !!unread);
}

/* --- журнал на вкладке «Я» --- */
function ago(iso) {
  const s = Math.max(0, (now() - Date.parse(iso)) / 1000);
  if (s < 60) return "только что";
  const m = Math.floor(s / 60); if (m < 60) return m + " мин назад";
  const h = Math.floor(m / 60); if (h < 24) return h + " ч назад";
  return Math.floor(h / 24) + " дн назад";
}
const times = (n) => { const a = n % 10, b = n % 100; return `${n} ${a >= 2 && a <= 4 && (b < 12 || b > 14) ? "раза" : "раз"}`; };
function renderJournal() {
  if (!srv) return;
  const p = CHARS[partnerOf(srv.actor)];
  const g = (f, m) => (p.f ? f : m);
  const t = srv.journal.today || [];
  const n = (k) => (t.find((e) => e.kind === k) || {}).n || 0;
  const parts = [];
  if (n("feed")) parts.push(`${g("покормила", "покормил")} тебя ${times(n("feed"))}`);
  if (n("hug")) parts.push(`${g("обняла", "обнял")} ${times(n("hug"))}`);
  if (n("sleep")) parts.push(`${g("уложила", "уложил")} спать` + (n("sleep") > 1 ? " " + times(n("sleep")) : ""));
  $("today").textContent = parts.length ? `Сегодня ${p.name} ${parts.join(", ")}.` : `Сегодня ${p.name} ещё не ${g("заходила", "заходил")}.`;
  const words = { feed: g("покормила тебя", "покормил тебя"), hug: g("обняла тебя", "обнял тебя"), sleep: g("уложила тебя спать", "уложил тебя спать") };
  // одинаковые действия подряд (с перерывом меньше 15 минут) склеиваем: «покормил тебя 30 раз»
  const groups = [];
  for (const e of srv.journal.recent || []) {
    const last = groups[groups.length - 1];
    if (last && last.kind === e.kind && Date.parse(last.oldest) - Date.parse(e.created_at) < 15 * 60e3) { last.n++; last.oldest = e.created_at; }
    else groups.push({ kind: e.kind, n: 1, at: e.created_at, oldest: e.created_at });
  }
  const ul = $("recent"); ul.innerHTML = "";
  for (const gr of groups.slice(0, 8)) {
    const li = document.createElement("li");
    const what = document.createElement("span");
    what.textContent = `${p.name} ${words[gr.kind] || gr.kind}` + (gr.n > 1 && gr.kind !== "sleep" ? " " + times(gr.n) : "");
    const when = document.createElement("time"); when.textContent = ago(gr.at);
    li.append(what, when); ul.append(li);
  }
}

/* =========================================================
   Вкладки
   ========================================================= */
function openTab(t, first) {
  tab = t;
  const me = srv.actor;
  viewChar = t === "care" ? partnerOf(me) : me;
  cfg = CHARS[viewChar];
  // сбрасываем комнату под нового персонажа
  clearTimeout(walkTimer); clearTimeout(poseTimer); clearInterval(zTimer);
  walking = false; fighting = false; moodPose = null; bomzh = false; bomzhSeated = false; sadSeated = false; angryHugs = 0;
  S = {};
  mover.classList.remove("walking");
  scene.classList.remove("sleep", "shake");
  ch.className = "char"; delete ch.dataset.pose;
  $("bubble").classList.remove("show"); $("bedBubble").classList.remove("show"); $("cloud").classList.remove("show");
  fx.innerHTML = "";
  buildChar();
  const ph = $("placeholder");
  ph.hidden = cfg.ready;
  mover.style.visibility = cfg.ready ? "" : "hidden";
  if (!cfg.ready) ph.innerHTML = `<b>${cfg.mini} скоро ${cfg.f ? "появится" : "появится"} ✨</b>Картинки ещё рисуются`;
  requestAnimationFrame(() => {
    place(maxX() * .45, 0);
    sync(true);
    renderButtons(); renderJournal();
    scheduleWalk();
    if (t === "care" && cfg.ready && !greeted) { greeted = true; setTimeout(greet, 600); }
  });
}
$("tabCare").addEventListener("click", () => tab !== "care" && openTab("care"));
$("tabOwn").addEventListener("click", () => tab !== "own" && openTab("own"));

function greet() {
  const L = live(viewChar);
  if (bomzh || L.sleeping || L.fat) return;
  if (moodPose === "angry") return sayP("angryGreet", 1800);
  if (moodPose === "sad") return sayP("sadGreet", 2200);
  if (moodPose === "tired") return sayP("tiredGreet", 2200);
  if (L.food >= LOW && L.mood >= LOW && L.energy >= LOW) { showPose("happy", 2200); sayP("greet", 2200); hearts(4); }
}

/* =========================================================
   Действия
   ========================================================= */
const haptic = () => { try { tg.HapticFeedback.impactOccurred("light"); } catch (_) {} };
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}
async function send(action, extra) {
  try { const d = await api(action, extra); sync(false); renderJournal(); return d; }
  catch (e) { toast(e.message); return null; }
}

/* нажать на персонажа */
ch.addEventListener("click", () => {
  if (!cfg.ready) return;
  const care = tab === "care";
  if (S.sleeping) return sayP("bedTap");
  if (S.fat) return sayP("fatSad");
  if (bomzh) { play("squish"); return say(needPhrase() || "Мне плохо…"); }
  if (moodPose === "angry") {
    if (fighting) return;
    const t = Date.now();
    angryTaps = angryTaps.filter((t0) => t - t0 < 4000); angryTaps.push(t);
    stopWalking();
    if (angryTaps.length >= 3) { angryTaps = []; fight(); return; }
    play("jump"); sayP(angryTaps.length === 1 ? "angryTap1" : "angryTap2"); scheduleWalk();
    return;
  }
  if (moodPose === "sad") { play("squish"); return sayP("sadTap"); }
  if (moodPose === "tired") { play("squish"); return sayP("tiredTap"); }
  stopWalking(); play("jump"); haptic();
  sayP(care ? "tapCare" : "tapOwn");
  if (care) {
    hearts(3);
    if (Date.now() - lastTapSent > 3000) { lastTapSent = Date.now(); send("tap"); }
  }
  scheduleWalk();
});
$("bed").addEventListener("click", () => { if (S.sleeping) sayP("bedTap"); });

/* кормить */
$("bFeed").addEventListener("click", () => {
  if (S.sleeping) return sayP("asleepFeed");
  if (S.fat) return sayP("fatFeed");
  stopWalking(); haptic();
  const food = pick(cfg.food);
  const c = center(), s = scene.getBoundingClientRect();
  const p = document.createElement("span");
  p.className = "particle"; p.textContent = food; p.style.fontSize = "34px";
  p.style.left = (s.width / 2) + "px"; p.style.top = (s.height - 10) + "px";
  fx.append(p);
  const tx = c.x - s.width / 2, ty = (c.top + c.h * .2) - (s.height - 10);
  const anim = p.animate([
    { transform: "translate(-50%, -50%) scale(.8)" },
    { transform: `translate(calc(-50% + ${tx * .5}px), calc(-50% + ${ty * .5 - 70}px)) scale(1.2)`, offset: .5 },
    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(.3)`, opacity: .2 },
  ], { duration: 700, easing: "ease-in-out", fill: "forwards" });
  const req = api("feed", { fastFat: fastFat || undefined }).catch((e) => ({ error: e }));
  anim.onfinish = async () => {
    p.remove();
    const d = await req;
    if (d.error) { toast(d.error.message); return; }
    if (d.why === "sleeping") { sync(false); return sayP("asleepFeed"); }
    if (d.why === "fat") { sync(false); return sayP("fatFeed"); }
    if (d.becameFat) { sync(false); renderJournal(); return; }   // покажет «поправилась»
    const n = d.fedCount || 0;
    if (n >= 25) { basePose(); play("squish"); sayP("full25"); }
    else if (n >= 20) { basePose(); play("squish"); sayP("full20"); }
    else if (!bomzh && (!moodPose || moodPose === "cute") && Math.random() < .3) { showPose("happy", 1800); sayP("yumHappy"); }
    else {
      basePose(); play("squish");
      sayP(bomzh ? "bomzhFeed" : moodPose === "angry" ? "angryFeed" : moodPose === "sad" ? "sadFeed" : moodPose === "tired" ? "tiredFeed" : "yum");
    }
    sync(false); renderJournal(); scheduleWalk();
  };
});

/* обнять */
$("bHug").addEventListener("click", () => {
  if (S.fat) return sayP("fatHug");
  haptic();
  if (S.sleeping) { hearts(3); sayP("asleepHug"); send("hug"); return; }
  if (bomzh) { play("squish"); hearts(4); sayP("bomzhHug"); send("hug"); return; }
  if (moodPose === "angry") {
    if (fighting) return sayP("fightHug");
    angryHugs++; stopWalking();
    if (angryHugs < 3) { play("squish"); sayP("angryHug"); scheduleWalk(); return; }
    angryHugs = 0; showPose("cute", 2200); hearts(6); sayP("angryGive"); send("hug"); scheduleWalk(); return;
  }
  if (moodPose === "sad") { showPose("cute", 2000); hearts(6); sayP("sadHug"); send("hug"); return; }
  stopWalking(); showPose("cute", 2200); hearts(8); sayP("hug"); send("hug"); scheduleWalk();
});

/* спать / будить */
$("bSleep").addEventListener("click", async () => {
  if (S.fat) return sayP("fatSleep");
  haptic();
  const goingToSleep = !S.sleeping;
  setSleepVisual(goingToSleep, false);       // сразу, не дожидаясь сервера
  const d = await send(goingToSleep ? "sleep" : "wake");
  if (d && d.why === "fat") { sayP("fatSleep"); }
});

/* эмоция (своя) */
$("bMood").addEventListener("click", () => {
  if (S.fat) return sayP("fatMood");
  const m = $("moods"); m.hidden = !m.hidden; $("bMood").classList.toggle("on", !m.hidden);
  if (!m.hidden) {
    const cur = live(viewChar).emotion;
    for (const b of m.querySelectorAll("button")) b.classList.toggle("on", b.dataset.k === cur);
    for (const b of m.querySelectorAll("button")) {
      const k = b.dataset.k, e = EMO[k];
      b.innerHTML = `<span>${e.e}</span>${(cfg.f ? e.t.f : e.t.m).replace(/^./, (c) => c.toUpperCase()).replace("Всё хорошо", "Хорошо")}`;
    }
  }
});
$("moods").addEventListener("click", async (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  $("moods").hidden = true; $("bMood").classList.remove("on");
  haptic();
  srv.chars[viewChar].emotion = btn.dataset.k;   // сразу показываем
  sync(false);
  const d = await send("emotion", { emotion: btn.dataset.k });
  if (d && d.why === "fat") sayP("fatMood");
});

/* =========================================================
   Записки
   ========================================================= */
function openModal(html) { $("sheet").innerHTML = html; $("modal").hidden = false; }
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

$("bNote").addEventListener("click", () => {
  const to = CHARS[viewChar];
  openModal(`
    <h2>Записка для ${to.f ? "неё" : "него"}</h2>
    <div class="chips" id="tpl"></div>
    <textarea id="noteText" maxlength="200" placeholder="Или напиши своё…"></textarea>
    <div class="left" id="noteLeft">0 / 200</div>
    <div class="btns"><button type="button" id="noteCancel">Отмена</button><button type="button" class="primary" id="noteSend" disabled>Отправить</button></div>`);
  const ta = $("noteText");
  for (const t of NOTE_TEMPLATES) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = t;
    b.onclick = () => { ta.value = t; ta.dispatchEvent(new Event("input")); };
    $("tpl").append(b);
  }
  ta.addEventListener("input", () => { $("noteLeft").textContent = ta.value.length + " / 200"; $("noteSend").disabled = !ta.value.trim(); });
  $("noteCancel").onclick = closeModal;
  $("noteSend").onclick = async () => {
    $("noteSend").disabled = true;
    const d = await send("note", { text: ta.value.trim() });
    if (d) { closeModal(); toast("Записка отправлена 💌"); hearts(4); }
    else $("noteSend").disabled = false;
  };
});

async function openLetters() {
  const from = CHARS[partnerOf(srv.actor)];
  const notes = srv.notes || [];
  const list = notes.length
    ? notes.map((n) => `<div class="letter${n.read_at ? "" : " new"}"><p></p><time>${ago(n.created_at)}</time></div>`).join("")
    : `<p class="empty">${from.name} пока не ${from.f ? "оставляла" : "оставлял"} записок.</p>`;
  openModal(`<h2>Записки от ${from.f ? "неё" : "него"}</h2>${list}<div class="btns" style="grid-template-columns:1fr"><button type="button" id="lettersClose">Закрыть</button></div>`);
  // текст вставляем отдельно, чтобы он показывался как есть
  $("sheet").querySelectorAll(".letter p").forEach((p, i) => { p.textContent = notes[i].body; });
  $("lettersClose").onclick = closeModal;
  if (notes.some((n) => !n.read_at)) { await send("read_notes"); renderHeader(); renderButtons(); }
}
$("bLetters").addEventListener("click", openLetters);
$("poster").addEventListener("click", () => { if (tab === "own") openLetters(); });

/* =========================================================
   Время суток: 7–18 день, 18–22 вечер, 22–7 ночь
   ========================================================= */
const TIME_NAMES = { day: "день", evening: "вечер", night: "ночь" };
function applyTime() {
  const h = new Date().getHours();
  const real = h >= 22 || h < 7 ? "night" : h >= 18 ? "evening" : "day";
  const phase = timeOverride || real;
  scene.classList.toggle("is-night", phase === "night");
  scene.classList.toggle("is-evening", phase === "evening");
}
setInterval(applyTime, 60e3);
applyTime();

/* =========================================================
   Панель проверки (только для Полины)
   ========================================================= */
function renderDebug() {
  const show = !!(srv && srv.me.admin);
  $("debug").hidden = !show;
  if (!show) return;
  $("dAs").classList.toggle("on", asPasha);
  $("dAs").textContent = asPasha ? "Смотрю глазами Паши (нажми, чтобы вернуться)" : "Смотреть глазами Паши";
}
$("dAs").addEventListener("click", async () => {
  asPasha = !asPasha; greeted = false;
  try { await api("state"); } catch (e) { toast(e.message); }
  renderDebug(); openTab("care");
});
for (const [id, action] of [["dZero", "dbg_zero"], ["dFull", "dbg_full"], ["dFat", "dbg_fat"], ["dReset", "dbg_reset"]]) {
  $(id).addEventListener("click", async () => { await send(action, { target: viewChar }); toast("Готово"); });
}
$("dTime").addEventListener("click", () => {
  const order = [null, "day", "evening", "night"];
  timeOverride = order[(order.indexOf(timeOverride) + 1) % order.length];
  $("dTime").textContent = "Время суток: " + (timeOverride ? TIME_NAMES[timeOverride] : "по часам");
  applyTime();
});
$("dFastFat").addEventListener("change", (e) => { fastFat = e.target.checked; });

/* =========================================================
   Запуск
   ========================================================= */
async function refresh() {
  if (document.hidden || !srv) return;
  try { await api("state"); sync(false); renderJournal(); } catch (_) {}
}
async function start() {
  if (!tg || !tg.initData) {
    $("status").textContent = "Эту игру нужно открывать в Телеграме через бота " + BOT + ".";
    return;
  }
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (_) {}
  document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
  try {
    await api("state");
  } catch (e) {
    $("status").textContent = e.message;
    return;
  }
  $("status").hidden = true;
  $("game").hidden = false;
  renderDebug();
  openTab("care");
  setInterval(refresh, 15000);
  setInterval(() => { if (srv && cfg) { renderHeader(); sync(false); } }, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}
start();
</script>
